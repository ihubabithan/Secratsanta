<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Secret Santa</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-brand">🎅 Secret Santa</h1>
            <div class="nav-menu">
                <span id="user-name" class="nav-username"></span>
                <a href="/dashboard" class="nav-link">Dashboard</a>
                <a href="/tasks" class="nav-link">Tasks</a>
                <button id="logout-btn" class="btn btn-small">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="dashboard-header">
            <h2>🏆 Leaderboard</h2>
            <p>Top performers based on task completion</p>
        </div>

        <div id="error-message" class="error-message" style="display: none;"></div>

        <div class="card">
            <div class="leaderboard-info">
                <p><strong>Scoring System:</strong></p>
                <ul>
                    <li>✓ Completed Task: <strong style="color: #28a745;">+5 points</strong></li>
                    <li>✗ Incomplete Task: <strong style="color: #dc3545;">-5 points</strong></li>
                </ul>
            </div>
        </div>

        <div class="card">
            <div id="leaderboard-list">
                <p class="loading">Loading leaderboard...</p>
            </div>
        </div>
    </div>

    <script src="/js/leaderboard.js"></script>
</body>
</html>
